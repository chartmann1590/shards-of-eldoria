<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Eldoria - Battle Screen</title>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

                        "primary": "#f2ca50",
                        "on-error-container": "#ffdad6",
                        "secondary-fixed-dim": "#b9c3ff",

                    "spacing": {
                        "panel-padding": "16px",

                        "v-stack": "12px",
                        "safe-area-bottom": "34px",
                        "gutter": "16px",
                        "safe-area-top": "44px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "label-caps": ["Inter"],
                        "stat-lg": ["JetBrains Mono"],
                        "stat-sm": ["JetBrains Mono"],
                        "headline-md": ["Anybody"],
                        "headline-lg": ["Anybody"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-caps": ["11px", { "lineHeight": "16px", "letterSpacing": "0.1em", "fontWeight": "700" }],

                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]

                }
            }

<style>
        .panel-9slice {
            background-color: theme('colors.surface-container');
            border: 2px solid theme('colors.primary-container');
            box-shadow: inset 1px 1px 0 0 theme('colors.surface-container-high'), inset -1px -1px 0 0 theme('colors.surface-container-low');
            position: relative;
        }
        .rivet {
            width: theme('spacing.rivet-size');
            height: theme('spacing.rivet-size');
            background-color: theme('colors.primary-fixed');
            position: absolute;
        }
        .rivet-tl { top: -2px; left: -2px; }
        .rivet-tr { top: -2px; right: -2px; }
        .rivet-bl { bottom: -2px; left: -2px; }
        .rivet-br { bottom: -2px; right: -2px; }
        
        @keyframes damagePopup {
            0% { opacity: 0; transform: translateY(10px) rotate(0deg) scale(0.8); }
            20% { opacity: 1; transform: translateY(-20px) rotate(-10deg) scale(1.2); }
            80% { opacity: 1; transform: translateY(-30px) rotate(-5deg) scale(1); }
            100% { opacity: 0; transform: translateY(-40px) rotate(0deg) scale(0.9); }
        }
        
        .animate-damage {
            animation: damagePopup 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes pulseBorder {
            0% { border-color: theme('colors.primary-container'); }
            50% { border-color: theme('colors.primary-fixed'); box-shadow: 0 0 8px theme('colors.primary-fixed'); }
            100% { border-color: theme('colors.primary-container'); }
        }

        .active-character {
            animation: pulseBorder 2s infinite;
            border-width: 2px;
            border-style: solid;
        }

        @keyframes cursorBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .cursor-blink {
            animation: cursorBlink 1s infinite step-end;
        }
        
        .bg-pattern {
            background-image: radial-gradient(theme('colors.surface-container-highest') 1px, transparent 1px);
            background-size: 8px 8px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background h-screen w-screen overflow-hidden flex flex-col font-body-lg antialiased select-none">
<!-- Top App Bar - Intentionally Omitted as per semantic shell mandate for battle screen (transactional/focused) -->
<!-- Main Battle Area -->
<main class="flex-1 relative flex flex-col w-full h-full max-w-md mx-auto relative bg-pattern" data-alt="A dark, moody medieval forest clearing at twilight, serving as a tactical battleground. Deep navy and violet shadows obscure the ancient, twisted trees, while faint, eerie moonlight pierces the canopy. The style is a high-fidelity 16-bit JRPG aesthetic, utilizing high-contrast pixels and a cohesive palette of dark blues and deep purples. The ground is rugged terrain, perfectly setting the stage for an epic fantasy confrontation." style="background-image: linear-gradient(to bottom, rgba(7, 16, 51, 0.9), rgba(7, 16, 51, 0.9)), url('https://lh3.googleusercontent.com/aida-public/AB6AXuA-wyJXEopuq80hrYOiYySGqHZHLWNEqHb-q1EgarHE-oE5n6I_ktsHhw4vScQYplZWkrM8Ezb_O8sP4fp01psISgk_y3JkvH4zK9muGhpkrgOVu1IyJJgA_PadB0LJ6ZX7b3_IzWV1_JttBbniY4WCHBgKTSkDu-Kq2xqntLaGbJZueXO7rkkj0jUpzAwXMWWWjPykQpF9Fsde3MEmLFv-7DdMTkjWX1akS_NJDxGocEM5TJ6nUjwY8lnH36WtLB2U6gON_waRiqo'); background-size: cover; background-position: center;">
<!-- Enemies Section -->
<section class="flex-1 flex items-end justify-center gap-4 px-gutter pb-8 relative z-10 pt-safe-area-top">
<!-- Goblin 1 -->
<div class="flex flex-col items-center gap-2">
<div class="w-16 h-16 bg-surface-container border border-outline flex items-center justify-center relative shadow-lg shadow-surface-container-lowest">
<img alt="Goblin" class="w-full h-full object-cover pixelated" data-alt="A detailed, retro 16-bit sprite of a menacing green goblin wielding a crude rusted dagger. The goblin has exaggerated, jagged features and glowing yellow eyes, set against a dark background. The sprite uses a rich, dark color palette with sharp, high-contrast highlights typical of classic 90s RPG enemy design. It is posed aggressively, ready to strike." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCEHXKPO4pHaf-ztRw5Ntia3TTbfKnpzLkZHmrdeHw6xz3ehElDrXgYvstgnSa8GIipdV2Oj9AXk9UdJUz9n_6egMaPLu2Cq5NZEKBdQDigvtL6XyVqeENnJfKPpfHBSvD7r5EyFR2E6wVB8YbfEJ89uaYVdihPsWep9_Rhj48xQNH_DzrBDIkdh7zMmYpp0szFfC9dqk8z7R0Fa99dJPwSBbljF9OsG2m0Asr0vlF-x7BFcsHnS7wgYehDPbvDzbUEXe6EX1MoL5g"/>
</div>
<div class="w-full">
<div class="font-stat-sm text-stat-sm text-on-surface text-center mb-1">Goblin A</div>
<div class="w-full h-2 bg-error-container relative">
<div class="h-full bg-error" style="width: 100%;"></div>
</div>
</div>
</div>
<!-- Targeted Goblin -->
<div class="flex flex-col items-center gap-2 relative -translate-y-4">
<!-- Target Arrow -->
<div class="absolute -top-6 text-primary-fixed animate-bounce">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">arrow_drop_down</span>
</div>
<!-- Damage Popup -->
<div class="absolute -top-4 right-0 font-headline-lg text-headline-lg text-error font-bold drop-shadow-md animate-damage z-20 pointer-events-none">
                    -14
                </div>
<div class="w-20 h-20 bg-surface-container border-2 border-primary-fixed flex items-center justify-center relative shadow-lg shadow-primary-container/20">
<img alt="Goblin" class="w-full h-full object-cover pixelated opacity-80 mix-blend-screen" data-alt="A retro 16-bit sprite of a goblin currently taking damage. The goblin flashes with a bright red tint overlay, emphasizing the impact of an attack. Its posture is slightly recoiled. The sprite uses sharp, high-contrast pixels with deep shadows, staying true to a classic 90s console RPG aesthetic in a dark environment." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAMIwNwPluhKouN6AkGshDpyLs9TicjqSVVmnE-FBEf8VIqvFVnsntpi1nFFuWlnZlmlmrekLqKNB8bzRmrGbNQXOMSH2ZvvR8-iTtlDG-lU8bLDvMcyoz5dyJa5PHFBwN5GTSw6xP-VZAQGIUfP6CGh3L4PtJZkUY_O9FeX60W-euF5xpRfwpLmZ5pm-YFNyIKHsI-_1ZWw-f6VRogpYIKNEDP_l99QHoEeBW0ACudYHUJD6dF-_o2tmpuISBxjilhzSHcR_zh_5w" style="filter: sepia(1) hue-rotate(-50deg) saturate(3);"/>
</div>
<div class="w-full">
<div class="font-stat-sm text-stat-sm text-primary-fixed text-center mb-1 font-bold">Goblin B</div>
<div class="w-full h-2 bg-error-container relative">
<div class="h-full bg-error" style="width: 45%;"></div>
</div>
</div>
</div>
<!-- Wolf -->
<div class="flex flex-col items-center gap-2">
<div class="w-16 h-16 bg-surface-container border border-outline flex items-center justify-center relative shadow-lg shadow-surface-container-lowest">
<img alt="Wolf" class="w-full h-full object-cover pixelated" data-alt="A highly detailed 16-bit sprite of a snarling dire wolf. The wolf has dark grey fur with silver highlights and glowing red eyes, standing in an aggressive, low stance. The design uses crisp, high-contrast pixels on a dark navy background, perfectly capturing the essence of a classic 90s RPG bestiary entry. The mood is feral and dangerous." src="https://lh3.googleusercontent.com/aida-public/AB6AXuA1Ucjrrz1I7HYHQNQuh8hRm_AUrKitRnUPiwyv5PMLthb5f_MKShsjqYUK0lCn43ECatUlV5ZsH18DWd9e_stQ9zSQiZq0YWyGVUBvWqgksuEkhHu91qi1dRkjsbzyu6fs13wygBs4oCLg4xiO3_H2NTRCP4chv0DJjIjYX26WvuCtRyuquV6C2dFepjWSBhCmEGxFtKQHrwdf4fvSN7aUmxzad3FBjPwhK59sjUsHWtdtTPZKmgY2orbj1JR6MXxB-HooyRDVL88"/>
</div>
<div class="w-full">
<div class="font-stat-sm text-stat-sm text-on-surface text-center mb-1">Dire Wolf</div>
<div class="w-full h-2 bg-error-container relative">
<div class="h-full bg-error" style="width: 100%;"></div>
</div>
</div>
</div>
</section>
<!-- Flourish Separator -->
<div class="w-full flex items-center justify-center py-2 px-gutter z-10">
<div class="h-[2px] flex-1 bg-gradient-to-r from-transparent via-primary-container to-transparent opacity-50"></div>
<div class="mx-4 text-primary-container flex gap-1">
<div class="w-2 h-2 rotate-45 bg-primary-container"></div>
<div class="w-2 h-2 rotate-45 border border-primary-container"></div>
<div class="w-2 h-2 rotate-45 bg-primary-container"></div>
</div>
<div class="h-[2px] flex-1 bg-gradient-to-l from-transparent via-primary-container to-transparent opacity-50"></div>
</div>
<!-- Party Section -->

<!-- Character 1: Kael (Active) -->

</div>
</div>
</div>

<div class="rivet rivet-tl"></div><div class="rivet rivet-tr"></div>
<div class="rivet rivet-bl"></div><div class="rivet rivet-br"></div>
<div class="font-stat-sm text-stat-sm text-on-surface mb-1 truncate">LYRA</div>
<div class="space-y-1">

<div class="h-full bg-error" style="width: 60%;"></div>
</div>
</div>
<div class="flex items-center gap-1">

<div class="flex-1 h-3 bg-secondary-container border border-outline-variant relative">
<div class="h-full bg-secondary" style="width: 90%;"></div>
</div>
</div>
</div>
</div>
<!-- Character 3: Brann -->

<div class="rivet rivet-tl"></div><div class="rivet rivet-tr"></div>
<div class="rivet rivet-bl"></div><div class="rivet rivet-br"></div>

<div class="flex items-center gap-1">

<!-- Bottom Action Menu -->
<section class="h-48 w-full flex bg-surface border-t-2 border-primary-container z-20 pb-safe-area-bottom shadow-[0_-4px_20px_rgba(0,0,0,0.5)]">
<!-- Action List (Left) -->
<div class="w-1/3 border-r border-outline-variant p-2 flex flex-col gap-1 overflow-y-auto">
<button class="flex items-center gap-2 px-2 py-3 bg-surface-container-high rounded-DEFAULT border border-primary-container w-full group focus:outline-none focus:ring-1 focus:ring-primary-fixed">
<span class="text-primary-fixed text-xs cursor-blink">▶</span>
<span class="font-stat-sm text-stat-sm text-primary-fixed uppercase tracking-wider group-hover:text-primary-fixed-dim transition-colors">Attack</span>
</button>
<button class="flex items-center gap-2 px-2 py-3 hover:bg-surface-container rounded-DEFAULT w-full group focus:outline-none focus:bg-surface-container">
<span class="text-transparent text-xs">▶</span>
<span class="font-stat-sm text-stat-sm text-on-surface uppercase tracking-wider opacity-80 group-hover:opacity-100 transition-opacity">Skill</span>
</button>
<button class="flex items-center gap-2 px-2 py-3 hover:bg-surface-container rounded-DEFAULT w-full group focus:outline-none focus:bg-surface-container">
<span class="text-transparent text-xs">▶</span>
<span class="font-stat-sm text-stat-sm text-on-surface uppercase tracking-wider opacity-80 group-hover:opacity-100 transition-opacity">Item</span>
</button>
<button class="flex items-center gap-2 px-2 py-3 hover:bg-surface-container rounded-DEFAULT w-full group focus:outline-none focus:bg-surface-container">
<span class="text-transparent text-xs">▶</span>
<span class="font-stat-sm text-stat-sm text-on-surface uppercase tracking-wider opacity-80 group-hover:opacity-100 transition-opacity">Defend</span>
</button>
<button class="flex items-center gap-2 px-2 py-3 hover:bg-surface-container rounded-DEFAULT w-full group focus:outline-none focus:bg-surface-container">
<span class="text-transparent text-xs">▶</span>
<span class="font-stat-sm text-stat-sm text-on-surface uppercase tracking-wider opacity-80 group-hover:opacity-100 transition-opacity">Flee</span>
</button>
</div>

                </div>
<div class="flex justify-between items-center border-t border-outline-variant pt-2 mt-2">
<span class="font-stat-sm text-stat-sm text-primary">Iron Broadsword</span>
<span class="font-stat-sm text-stat-sm text-secondary">Target: Goblin B</span>
</div>
</div>
</section>
</main>
</body></html>
