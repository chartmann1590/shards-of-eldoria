<style>
    /* Add any custom CSS here if needed, but rely on Tailwind mostly */
    .rivet {
        width: 4px;
        height: 4px;
        background-color: #FFD86B; /* Gold Bright from spec */
        position: absolute;
    }
    .rivet-tl { top: 0; left: 0; }
    .rivet-tr { top: 0; right: 0; }
    .rivet-bl { bottom: 0; left: 0; }
    .rivet-br { bottom: 0; right: 0; }
    
    .panel-9slice {
        background-color: #16235A; /* Navy from spec Layer 1 */
        border: 2px solid #D4AF37; /* Primary Gold */
        position: relative;
        box-shadow: inset 1px 1px 0px 0px rgba(255, 255, 255, 0.1), inset -1px -1px 0px 0px rgba(0, 0, 0, 0.5);
    }
    
    .slot-9slice {
        background-color: #0B1437; /* Deep Navy */
        border: 1px solid #4d4635; /* Outline variant for slots */
        position: relative;
    }
    
    .slot-selected {
        border-color: #D4AF37;
        box-shadow: 0 0 8px rgba(212, 175, 55, 0.6), inset 0 0 4px rgba(212, 175, 55, 0.4);

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md overflow-hidden">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-panel-padding h-14 bg-surface dark:bg-surface border-b-2 border-primary-container relative after:content-[''] after:absolute after:-bottom-1 after:-right-1 after:w-1 after:h-1 after:bg-primary-fixed pt-safe-area-top">
<button aria-label="Go Back" class="text-primary dark:text-primary-fixed flex items-center justify-center p-2 hover:bg-surface-variant active:scale-95 transition-transform">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-lg text-headline-lg text-primary dark:text-primary-fixed tracking-widest absolute left-1/2 -translate-x-1/2">
            INVENTORY
        </h1>
<div class="flex items-center gap-2">
<span class="font-stat-lg text-stat-lg text-primary-fixed">127g</span>
</div>
</header>
<!-- Main Canvas -->
<main class="flex-1 mt-[calc(14px+44px)] mb-safe-area-bottom overflow-y-auto px-gutter py-panel-padding flex flex-col gap-v-stack">
<!-- Filters -->
<nav class="flex overflow-x-auto gap-2 pb-2 hide-scrollbar shrink-0">
<button class="bg-primary-container text-on-primary-container font-label-caps text-label-caps px-4 py-2 rounded uppercase whitespace-nowrap active:scale-95 transition-transform">All</button>
<button class="bg-surface-variant border border-outline-variant text-on-surface-variant font-label-caps text-label-caps px-4 py-2 rounded uppercase whitespace-nowrap active:scale-95 transition-transform">Potions</button>
<button class="bg-surface-variant border border-outline-variant text-on-surface-variant font-label-caps text-label-caps px-4 py-2 rounded uppercase whitespace-nowrap active:scale-95 transition-transform">Weapons</button>
<button class="bg-surface-variant border border-outline-variant text-on-surface-variant font-label-caps text-label-caps px-4 py-2 rounded uppercase whitespace-nowrap active:scale-95 transition-transform">Armor</button>
<button class="bg-surface-variant border border-outline-variant text-on-surface-variant font-label-caps text-label-caps px-4 py-2 rounded uppercase whitespace-nowrap active:scale-95 transition-transform">Key Items</button>
</nav>
<!-- Inventory Grid Panel -->
<div class="panel-9slice p-panel-padding flex-1 overflow-y-auto">
<div class="rivet rivet-tl"></div>
<div class="rivet rivet-tr"></div>
<div class="rivet rivet-bl"></div>
<div class="rivet rivet-br"></div>
<div class="grid grid-cols-4 gap-2">
<!-- Selected Slot -->
<button class="slot-9slice slot-selected aspect-square flex flex-col items-center justify-center p-1 group relative outline-none focus:ring-0">
<span class="material-symbols-outlined text-red-400 text-3xl group-hover:scale-110 transition-transform" style="font-variation-settings: 'FILL' 1;">local_drink</span>
<span class="absolute bottom-1 right-1 font-stat-sm text-stat-sm text-primary-fixed drop-shadow-md">×3</span>
</button>
<!-- Normal Slots -->
<button class="slot-9slice aspect-square flex flex-col items-center justify-center p-1 group relative hover:border-primary-container transition-colors">
<span class="material-symbols-outlined text-gray-300 text-3xl group-hover:scale-110 transition-transform" style="font-variation-settings: 'FILL' 1;">swords</span>
</button>
<button class="slot-9slice aspect-square flex flex-col items-center justify-center p-1 group relative hover:border-primary-container transition-colors">
<span class="material-symbols-outlined text-blue-300 text-3xl group-hover:scale-110 transition-transform" style="font-variation-settings: 'FILL' 1;">shield</span>
</button>
<button class="slot-9slice aspect-square flex flex-col items-center justify-center p-1 group relative hover:border-primary-container transition-colors">
<span class="material-symbols-outlined text-purple-400 text-3xl group-hover:scale-110 transition-transform" style="font-variation-settings: 'FILL' 1;">key</span>
</button>

<div class="panel-9slice p-panel-padding shrink-0 bg-[#1F3279] border-[#FFD86B]"> <!-- Layer 2 style -->
<div class="rivet rivet-tl bg-[#FFD86B]"></div>
<div class="rivet rivet-tr bg-[#FFD86B]"></div>
<div class="rivet rivet-bl bg-[#FFD86B]"></div>
<div class="rivet rivet-br bg-[#FFD86B]"></div>
<div class="flex flex-col gap-2">
<div class="flex justify-between items-start">
<h2 class="font-headline-md text-headline-md text-primary-fixed">Healing Potion</h2>
<span class="font-stat-sm text-stat-sm text-on-surface-variant">Consumable</span>
</div>
<p class="font-body-md text-body-md text-on-surface">Restores 30 HP. A basic red liquid smelling faintly of strawberries and old magic.</p>
<div class="flex gap-2 mt-2">
<button class="flex-1 bg-primary-container text-on-primary-container font-label-caps text-label-caps py-3 rounded-DEFAULT uppercase font-bold active:scale-95 transition-transform">USE</button>
<button class="flex-1 bg-surface-variant border-2 border-error text-error font-label-caps text-label-caps py-3 rounded-DEFAULT uppercase active:scale-95 transition-transform">DISCARD</button>
</div>
</div>
</div>
