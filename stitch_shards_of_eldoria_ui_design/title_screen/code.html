<style>
        .material-symbols-outlined {

        /* Tactical CRT Scanline Effect Overlay */
        .scanlines::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));

            pointer-events: none;
            opacity: 0.15;
        }

        /* 9-Slice Style Border Utilities */
        .panel-border {
            border: 2px solid theme('colors.primary-container');
            box-shadow: inset 1px 1px 0 theme('colors.surface-bright'),

            position: relative;
        }

        /* Button Press Effect */

<script>
        // Simple intro animation script
        document.addEventListener('DOMContentLoaded', () => {
            const logo = document.getElementById('logo-container');
            // Start slightly scaled up and fade in
            logo.style.opacity = '0';
            logo.style.transform = 'scale(1.1) translateY(-20px)';
            
            requestAnimationFrame(() => {
                setTimeout(() => {
                    logo.style.transition = 'all 1.2s cubic-bezier(0.2, 0.8, 0.2, 1)';
                    logo.style.opacity = '1';
                    logo.style.transform = 'scale(1) translateY(0)';
                }, 100);
            });
        });
    </script>
