<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Overworld / Game Screen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;family=JetBrains+Mono:wght@500;700&amp;family=Anybody:wght@700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed": "#dde1ff",
                        "primary-fixed": "#ffe088",
                        "on-primary-container": "#554300",
                        "on-tertiary-container": "#4e442f",
                        "tertiary-fixed": "#f0e1c3",
                        "inverse-surface": "#dde1ff",
                        "on-surface-variant": "#d0c5af",
                        "inverse-on-surface": "#262e52",
                        "surface-variant": "#2a3357",
                        "surface": "#071033",
                        "surface-container-high": "#1f284b",
                        "tertiary-fixed-dim": "#d3c5a8",
                        "on-tertiary": "#38301b",
                        "on-secondary": "#1f2c63",
                        "surface-container": "#151d40",
                        "on-secondary-fixed": "#06154d",
                        "surface-bright": "#2f375b",
                        "primary-container": "#d4af37",
                        "primary-fixed-dim": "#e9c349",
                        "tertiary-container": "#bfb296",
                        "outline-variant": "#4d4635",
                        "on-surface": "#dde1ff",
                        "surface-container-lowest": "#030a2e",
                        "surface-dim": "#071033",
                        "background": "#071033",
                        "error": "#ffb4ab",
                        "on-secondary-container": "#a6b2f1",
                        "on-tertiary-fixed": "#221b08",
                        "secondary-container": "#37437b",
                        "secondary": "#b9c3ff",
                        "on-primary": "#3c2f00",
                        "on-error": "#690005",
                        "surface-container-low": "#10193c",
                        "error-container": "#93000a",
                        "on-tertiary-fixed-variant": "#4f4630",
                        "on-primary-fixed": "#241a00",
                        "on-primary-fixed-variant": "#574500",
                        "tertiary": "#dccdb0",
                        "primary": "#f2ca50",
                        "on-error-container": "#ffdad6",
                        "secondary-fixed-dim": "#b9c3ff",
                        "on-secondary-fixed-variant": "#37437b",
                        "outline": "#99907c",
                        "on-background": "#dde1ff",
                        "inverse-primary": "#735c00",
                        "surface-tint": "#e9c349",
                        "surface-container-highest": "#2a3357"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "panel-padding": "16px",
                        "rivet-size": "4px",
                        "v-stack": "12px",
                        "safe-area-bottom": "34px",
                        "gutter": "16px",
                        "safe-area-top": "44px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "label-caps": ["Inter"],
                        "stat-lg": ["JetBrains Mono"],
                        "stat-sm": ["JetBrains Mono"],
                        "headline-md": ["Anybody"],
                        "headline-lg": ["Anybody"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-caps": ["11px", { "lineHeight": "16px", "letterSpacing": "0.1em", "fontWeight": "700" }],
                        "stat-lg": ["18px", { "lineHeight": "24px", "fontWeight": "700" }],
                        "stat-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "headline-md": ["18px", { "lineHeight": "24px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "0.05em", "fontWeight": "800" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1;
        }
        
        /* 9-slice panel simulation */
        .panel-9slice {
            background-color: theme('colors.surface-container');
            border: 2px solid theme('colors.primary-container');
            position: relative;
            box-shadow: inset 1px 1px 0 0 theme('colors.surface-bright'), inset -1px -1px 0 0 theme('colors.surface-container-lowest');
        }
        
        .rivet {
            position: absolute;
            width: theme('spacing.rivet-size');
            height: theme('spacing.rivet-size');
            background-color: theme('colors.primary-fixed');
            z-index: 10;
        }
        .rivet-tl { top: -2px; left: -2px; }
        .rivet-tr { top: -2px; right: -2px; }
        .rivet-bl { bottom: -2px; left: -2px; }
        .rivet-br { bottom: -2px; right: -2px; }

        /* Game Grid Styling */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(11, 1fr);
            grid-template-rows: repeat(9, 1fr);
            aspect-ratio: 11/9;
            background-color: theme('colors.surface-container-lowest');
            gap: 1px;
            padding: 1px;
        }
        
        .tile {
            background-color: theme('colors.surface-container');
            position: relative;
        }
        .tile-grass { background-color: #1a3622; }
        .tile-tree { background-color: #0d2112; }
        .tile-path { background-color: #3b2f21; }
        
        /* D-Pad Buttons */
        .d-pad-btn {
            background-color: theme('colors.surface-container');
            border: 2px solid theme('colors.primary-container');
            display: flex;
            align-items: center;
            justify-content: center;
            color: theme('colors.primary-fixed');
        }
        .d-pad-btn:active {
            background-color: theme('colors.surface-container-high');
        }
        
        /* Action Buttons */
        .action-btn {
            background-color: theme('colors.surface-container');
            border: 2px solid theme('colors.primary-container');
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: theme('colors.primary-fixed');
            box-shadow: inset 2px 2px 0 0 theme('colors.surface-bright'), inset -2px -2px 0 0 theme('colors.surface-container-lowest');
        }
        .action-btn:active {
            box-shadow: inset -2px -2px 0 0 theme('colors.surface-bright'), inset 2px 2px 0 0 theme('colors.surface-container-lowest');
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-lg h-screen w-screen overflow-hidden flex flex-col pt-safe-area-top pb-safe-area-bottom">
<!-- Top Status Strip -->
<header class="w-full h-10 px-panel-padding flex justify-between items-center bg-surface border-b-2 border-primary-container relative z-10 shrink-0">
<!-- HP -->
<div class="flex items-center space-x-2">
<span class="material-symbols-outlined filled text-error text-xl">favorite</span>
<span class="font-stat-lg text-stat-lg text-error">32/48</span>
</div>
<!-- Location -->
<div class="font-headline-md text-headline-md text-primary tracking-widest text-center flex-1 mx-4 truncate">
            WHISPERING FOREST
        </div>
<!-- Gold -->
<div class="flex items-center space-x-1">
<span class="material-symbols-outlined text-primary text-xl">monetization_on</span>
<span class="font-stat-lg text-stat-lg text-primary">127g</span>
</div>
</header>
<!-- Main Play Area Canvas -->
<main class="flex-1 w-full bg-surface-container-lowest relative flex items-center justify-center overflow-hidden p-2">
<!-- Auto-save indicator -->
<div class="absolute top-4 right-4 flex items-center space-x-2 opacity-50 z-20">
<span class="font-label-caps text-label-caps text-on-surface-variant">AUTO-SAVED</span>
<span class="material-symbols-outlined text-on-surface-variant text-sm">save</span>
</div>
<!-- The 11x9 Grid -->
<div class="game-grid w-full max-w-2xl border-2 border-primary-container relative">
<!-- JavaScript will populate tiles -->
<!-- Adding a few static tiles for semantic structure -->
<!-- Row 1 -->
<div class="tile tile-grass"></div>
<div class="tile tile-tree"></div>
<div class="tile tile-tree"></div>
<div class="tile tile-grass"></div>
<div class="tile tile-path"></div>
<div class="tile tile-path"></div>
<div class="tile tile-path"></div>
<div class="tile tile-grass"></div>
<div class="tile tile-tree"></div>
<div class="tile tile-tree"></div>
<div class="tile tile-grass"></div>
<!-- Center Sprite Area (Row 5, Col 6) -->
<!-- This is a placeholder for where the actual grid structure would go. 
                 Using CSS Grid for actual layout but hardcoding a few key entities absolutely for demo -->
<!-- Hero Sprite (Center) -->
<div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-[9%] aspect-square bg-surface-container border border-primary z-10 flex items-center justify-center shadow-lg">
<span class="material-symbols-outlined text-primary text-2xl">swords</span>
</div>
<!-- NPC Sprite -->
<div class="absolute top-[30%] left-[30%] w-[9%] aspect-square bg-surface-container border border-tertiary z-10 flex items-center justify-center">
<span class="material-symbols-outlined text-tertiary text-2xl">person</span>
</div>
<!-- Enemy Sprite -->
<div class="absolute top-[70%] left-[70%] w-[9%] aspect-square bg-error-container border border-error z-10 flex items-center justify-center">
<span class="material-symbols-outlined text-error text-2xl">skull</span>
</div>
<!-- Chest -->
<div class="absolute top-[20%] right-[20%] w-[9%] aspect-square bg-surface-container border border-primary-container z-10 flex items-center justify-center">
<span class="material-symbols-outlined text-primary-container text-2xl">inventory_2</span>
</div>
</div>
</main>
<!-- Bottom Controls Area -->
<div class="h-[180px] w-full panel-9slice px-gutter flex justify-between items-center shrink-0">
<div class="rivet rivet-tl"></div>
<div class="rivet rivet-tr"></div>
<!-- Left: D-Pad -->
<div class="w-32 h-32 relative flex items-center justify-center">
<button aria-label="Up" class="d-pad-btn absolute top-0 w-10 h-10 rounded-t-sm">
<span class="material-symbols-outlined">arrow_drop_up</span>
</button>
<button aria-label="Down" class="d-pad-btn absolute bottom-0 w-10 h-10 rounded-b-sm">
<span class="material-symbols-outlined">arrow_drop_down</span>
</button>
<button aria-label="Left" class="d-pad-btn absolute left-0 w-10 h-10 rounded-l-sm">
<span class="material-symbols-outlined">arrow_left</span>
</button>
<button aria-label="Right" class="d-pad-btn absolute right-0 w-10 h-10 rounded-r-sm">
<span class="material-symbols-outlined">arrow_right</span>
</button>
<!-- Center decorative square -->
<div class="w-10 h-10 bg-surface-container-lowest border border-surface-bright z-10"></div>
</div>
<!-- Right: Action Buttons -->
<div class="flex items-end space-x-6 h-full py-4 relative">
<!-- B Button (Secondary) -->
<div class="flex flex-col items-center justify-end mb-4">
<button aria-label="Menu" class="action-btn w-12 h-12 mb-2">
<span class="font-headline-md text-headline-md">B</span>
</button>
<span class="font-label-caps text-label-caps text-on-surface-variant">MENU</span>
</div>
<!-- A Button (Primary) -->
<div class="flex flex-col items-center justify-end">
<button aria-label="Talk or Confirm" class="action-btn w-16 h-16 mb-2 border-primary-fixed text-primary-fixed bg-surface-container-high">
<span class="font-headline-lg text-headline-lg">A</span>
</button>
<span class="font-label-caps text-label-caps text-on-surface-variant text-center w-20 leading-tight">TALK /<br/>CONFIRM</span>
</div>
</div>
</div>
<!-- Quick Script to populate the rest of the grid for visual effect -->
<script>
        document.addEventListener("DOMContentLoaded", () => {
            const grid = document.querySelector('.game-grid');
            const totalCells = 11 * 9;
            const existingCells = grid.querySelectorAll('.tile').length;
            
            // Simple map generation pattern
            for (let i = existingCells; i < totalCells; i++) {
                const div = document.createElement('div');
                div.className = 'tile';
                
                // Randomize terrain slightly for visual texture
                const rand = Math.random();
                if (rand < 0.6) div.classList.add('tile-grass');
                else if (rand < 0.8) div.classList.add('tile-tree');
                else div.classList.add('tile-path');
                
                grid.appendChild(div);
            }
        });
    </script>
</body></html>
